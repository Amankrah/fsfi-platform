# fsfvi.ai: public FSFI platform (Next.js on 127.0.0.1:3010, FastAPI on 127.0.0.1:8010).
#
# This server block serves fsfvi.ai and www.fsfvi.ai only, with a certificate of its own.
# No other hostname shares this certificate or this file.
#
#   sudo cp deploy/nginx/fsfvi.ai.conf /etc/nginx/sites-available/fsfvi.ai
#   sudo ln -sf /etc/nginx/sites-available/fsfvi.ai /etc/nginx/sites-enabled/fsfvi.ai
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d fsfvi.ai -d www.fsfvi.ai
#   (then uncomment the 443 block below, nginx -t, reload)

limit_req_zone $binary_remote_addr zone=fsfi_platform_api:10m rate=20r/s;

upstream fsfi_platform_web { server 127.0.0.1:3010; keepalive 32; }
upstream fsfi_platform_api { server 127.0.0.1:8010; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name fsfvi.ai www.fsfvi.ai;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://fsfvi.ai$request_uri; }
}

